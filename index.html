<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5661E4">
<title>スキマ — みんなの空きが一目でわかる日程調整</title>
<meta name="description" content="インストール不要・ログイン不要。リンクを送るだけで、みんなの空き時間が一目でわかる日程調整ツール。">
<style>
  :root{
    --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#F1F2F6;
    --ink:#1A1D28; --muted:#666C7E; --faint:#9AA0B2;
    --line:#E4E6EC; --line-strong:#D3D6DF;
    --accent:#5661E4; --accent-ink:#FFFFFF; --accent-soft:#EAEBFB;
    --ok:#1FA267; --maybe:#DB9527; --no:#B75067;
    --amber:#F4A62B; --amber-soft:#FCEBCF; --sun:#C0392B; --sat:#3B6FD4;
    --radius:16px; --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,22,35,.05), 0 10px 30px rgba(20,22,35,.07);
    --heat:86,97,228;
    --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#12141B; --surface:#1B1E27; --surface-2:#232634;
      --ink:#EEF0F6; --muted:#9BA1B2; --faint:#6C7284;
      --line:#2A2E3A; --line-strong:#373C4A;
      --accent:#7E88F2; --accent-ink:#12141B; --accent-soft:#262A45;
      --ok:#3EBE83; --maybe:#EBB358; --no:#DB7488;
      --amber:#F5B043; --amber-soft:#3A2F1A; --sun:#E8798A; --sat:#7FA6F0;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.35);
      --heat:126,136,242;
    }
  }
  :root[data-theme="light"]{
    --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#F1F2F6;
    --ink:#1A1D28; --muted:#666C7E; --faint:#9AA0B2;
    --line:#E4E6EC; --line-strong:#D3D6DF;
    --accent:#5661E4; --accent-ink:#FFFFFF; --accent-soft:#EAEBFB;
    --ok:#1FA267; --maybe:#DB9527; --no:#B75067;
    --amber:#F4A62B; --amber-soft:#FCEBCF; --sun:#C0392B; --sat:#3B6FD4;
    --shadow:0 1px 2px rgba(20,22,35,.05), 0 10px 30px rgba(20,22,35,.07);
    --heat:86,97,228;
  }
  :root[data-theme="dark"]{
    --bg:#12141B; --surface:#1B1E27; --surface-2:#232634;
    --ink:#EEF0F6; --muted:#9BA1B2; --faint:#6C7284;
    --line:#2A2E3A; --line-strong:#373C4A;
    --accent:#7E88F2; --accent-ink:#12141B; --accent-soft:#262A45;
    --ok:#3EBE83; --maybe:#EBB358; --no:#DB7488;
    --amber:#F5B043; --amber-soft:#3A2F1A; --sun:#E8798A; --sat:#7FA6F0;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 34px rgba(0,0,0,.35);
    --heat:126,136,242;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.55; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; font-feature-settings:"palt" 1;}
  .wrap{max-width:680px; margin:0 auto; padding:0 16px 120px;}
  h1,h2,h3{margin:0; text-wrap:balance; letter-spacing:.01em}
  button{font-family:inherit}
  a{color:var(--accent)}
  .tnum{font-variant-numeric:tabular-nums}

  header.app{position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--bg) 86%, transparent); backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line);}
  .head-in{max-width:680px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:10px}
  .logo{display:flex; align-items:center; gap:9px; cursor:pointer; user-select:none}
  .logo .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 55%, #b06bff));position:relative;box-shadow:0 3px 10px rgba(var(--heat),.4)}
  .logo .mark::before{content:"";position:absolute;inset:7px 6px;border-radius:3px;background:var(--surface);clip-path:polygon(0 0,55% 0,55% 45%,100% 45%,100% 100%,0 100%)}
  .logo .name{font-weight:800; font-size:19px; letter-spacing:.04em}
  .logo .name small{font-weight:600;color:var(--faint);font-size:11px;letter-spacing:.14em;display:block;margin-top:-4px}
  .spacer{flex:1}
  .theme-btn{border:1px solid var(--line-strong); background:var(--surface); color:var(--muted); width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:16px;display:grid;place-items:center}
  .theme-btn:hover{color:var(--ink);border-color:var(--accent)}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-top:16px}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
  .lead{font-size:15px;color:var(--muted)}
  label.fld{display:block;margin-top:16px}
  label.fld .lbl{font-size:13px;font-weight:700;color:var(--ink);display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .fldblock{margin-top:16px}
  .fldblock>.lbl{font-size:13px;font-weight:700;color:var(--ink);display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .lbl .opt{font-weight:600;color:var(--faint);font-size:11px}
  input[type=text],input[type=date],textarea,select{width:100%; font:inherit; color:var(--ink); background:var(--surface-2); border:1.5px solid var(--line-strong); border-radius:var(--radius-sm); padding:11px 12px;}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{resize:vertical;min-height:64px}
  select.inline{width:auto;padding:9px 10px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line-strong);background:var(--surface-2);color:var(--muted);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;user-select:none}
  .chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .chip.mini{padding:6px 11px;font-size:12.5px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-weight:800;font-size:15px;padding:13px 18px;cursor:pointer;border:1.5px solid transparent;transition:transform .04s ease}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(var(--heat),.35)}
  .btn.ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn.line{background:#06C755;color:#fff}
  .btn.block{display:flex;width:100%}
  .btn.sm{padding:9px 13px;font-size:13.5px;border-radius:10px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row.tight{gap:8px}
  .row.vcenter{align-items:center}

  .steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px}
  .step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px}
  .step .n{width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:13px}
  .step h3{font-size:14px;margin:10px 0 4px}
  .step p{margin:0;font-size:12.5px;color:var(--muted)}

  /* Calendar */
  .cal{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:4px}
  .cal th{font-size:12px;color:var(--muted);font-weight:700;padding:6px 0;cursor:pointer;border-radius:8px;user-select:none}
  .cal th:hover{color:var(--accent);background:var(--accent-soft)}
  .cal th.sat{color:var(--sat)} .cal th.sun{color:var(--sun)}
  .cal td{text-align:center;padding:3px 2px}
  .cal .d{width:100%;aspect-ratio:1/1;max-width:46px;margin:0 auto;display:grid;place-items:center;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);border:1.5px solid transparent;position:relative;touch-action:none}
  .calnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .calnav-btn{border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 11px;font-weight:700;font-size:12.5px;cursor:pointer}
  .calnav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .calnav-btn:disabled{opacity:.4;cursor:not-allowed}
  .calnav-range{font-weight:800;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
  .gridnav{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px}
  .gnav{border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);width:40px;height:34px;border-radius:9px;font-size:18px;font-weight:800;cursor:pointer;line-height:1}
  .gnav:hover{border-color:var(--accent);color:var(--accent)}
  .gridnav-hint{font-size:12px;color:var(--muted)}
  .proxyname{background:var(--accent-soft);border:1.5px solid var(--accent);color:var(--accent);border-radius:10px;padding:11px 12px;font-weight:800}
  .cal .d:hover{background:var(--surface-2)}
  .cal .d.sel{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 10px rgba(var(--heat),.35)}
  .cal .d.sel:hover{background:var(--accent)}
  .cal .d.today{border-color:var(--accent)}
  .cal .d.past{color:var(--faint);opacity:.35;cursor:default}
  .cal .d.past:hover{background:transparent}
  .calhint{font-size:12px;color:var(--muted);margin:8px 0 2px}
  .selcount{font-weight:800;color:var(--accent)}

  /* Time custom */
  .timecustom{margin-top:12px;padding:12px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:12px}

  /* Deadline banner (share) */
  .dlbanner{display:flex;align-items:center;gap:10px;margin:14px 0;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,var(--amber-soft),transparent);border:1.5px solid var(--amber);font-weight:800}
  .dlbanner .ic{font-size:20px}
  .dlbanner b{font-size:19px}
  .dlbanner .cap{font-size:12px;font-weight:700;color:var(--muted);display:block}
  .dlbanner.none{background:var(--surface-2);border-color:var(--line-strong);color:var(--muted);font-weight:700}
  .card.decided{border:2px solid var(--ok);background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 12%,transparent),transparent)}
  .decdate{font-size:22px;font-weight:800;margin:6px 0 0;letter-spacing:.01em}
  .inapp{margin-top:12px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--amber) 14%,transparent);border:1px solid var(--amber);font-size:12.5px;color:var(--ink)}
  /* マイ履歴 */
  .histrow{display:flex;gap:8px;align-items:stretch}
  .histopen{flex:1;text-align:left;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:11px;padding:10px 12px;cursor:pointer;color:var(--ink);display:block}
  .histopen:hover{border-color:var(--accent)}
  .histtitle{display:block;font-weight:800;font-size:14px}
  .histmeta{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .histx{padding:0 12px}
  .adminlink{background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:12px;padding:12px;margin-top:4px}
  .lockinfo{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-strong);font-size:12.5px;color:var(--muted);line-height:1.7}
  /* オーナー画面 */
  .ownercard{padding:16px}
  .tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
  .tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);border-color:var(--ok);color:var(--ok)}

  .linkbox{display:block;margin-top:6px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:12px;padding:12px;word-break:break-all;font-size:12.5px;color:var(--accent);text-decoration:none}

  /* Matrix */
  .matrix-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
  .bulkrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 2px}
  /* 入力があるときだけ「クリア」を目立たせる（誤入力にすぐ気づけるように） */
  .clearbtn.armed{color:#fff;background:var(--no);border-color:var(--no);box-shadow:0 0 0 0 color-mix(in srgb,var(--no) 60%,transparent);animation:clearpulse 1.6s ease-out infinite}
  .clearbtn.armed:hover{color:#fff;border-color:var(--no)}
  @keyframes clearpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--no) 55%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
  @media (prefers-reduced-motion:reduce){.clearbtn.armed{animation:none}}
  table.mx th.taph{cursor:pointer}
  table.mx th.taph:hover{color:var(--accent);background:var(--accent-soft)}
  table.mx{border-collapse:separate;border-spacing:0;width:max-content}
  /* スクロールで見出しが上端に来たとき“ふわっと”固定される浮動ヘッダー */
  .float-head{position:fixed;top:0;z-index:30;overflow:hidden;background:var(--surface-2);border-bottom:1px solid var(--line-strong);box-shadow:0 4px 10px rgba(20,22,35,.06);pointer-events:none;opacity:0;transition:opacity .16s ease;display:none;border-radius:0 0 6px 6px}
  .float-head.show{display:block;opacity:1}
  .float-head.tappable{pointer-events:auto}
  .float-head table.mx{margin:0}
  .float-head thead th{position:sticky;top:0;background:var(--surface-2)}
  .float-head thead th:first-child{position:sticky;left:0;z-index:2}
  table.mx th,table.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
  table.mx thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font-size:12px;color:var(--muted);font-weight:700;padding:8px 6px;white-space:nowrap;min-width:60px}
  table.mx thead th small{display:block;color:var(--faint);font-weight:600;font-size:10px}
  table.mx tbody th{position:sticky;left:0;z-index:2;background:var(--surface-2);font-size:12px;color:var(--muted);font-weight:700;padding:8px 10px;white-space:nowrap;text-align:right;min-width:52px}
  table.mx thead th:first-child{position:sticky;left:0;z-index:4}
  .cell{width:var(--cellw,60px);height:48px;text-align:center;cursor:pointer;user-select:none;font-weight:800;font-size:17px;position:relative}
  /* 中身のない見出し（「終日」だけ等）は場所を取らせない */
  table.mx th.blank{min-width:0;padding:6px 2px}
  table.mx tbody th small{color:var(--faint);font-weight:600;font-size:10px;margin-left:3px}
  .cell.paint{touch-action:none}
  .gridbox{position:relative}
  .gridhint{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
  .scroll-arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;display:none;place-items:center;background:color-mix(in srgb,var(--accent) 84%,transparent);color:#fff;font-size:24px;font-weight:800;line-height:1;cursor:pointer;z-index:6;box-shadow:0 3px 12px rgba(0,0,0,.28);animation:arrpulse 1.4s ease-in-out infinite}
  .scroll-arrow.show{display:grid}
  .scroll-arrow.left{left:58px} .scroll-arrow.right{right:8px}
  @keyframes arrpulse{0%,100%{opacity:.35}50%{opacity:.95}}
  .cell .who{position:absolute;left:0;right:0;bottom:3px;font-size:9px;font-weight:700;color:var(--faint)}
  .cell.v0{color:var(--faint)}
  .cell.v1{color:var(--maybe);background:color-mix(in srgb,var(--maybe) 12%,transparent)}
  .cell.v2{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
  .cell.picked{box-shadow:inset 0 0 0 3px var(--ok)}
  .cell.picked::before{content:"✓";position:absolute;top:1px;right:3px;font-size:10px;font-weight:800;color:var(--ok)}
  .cell.hit{box-shadow:inset 0 0 0 3px var(--accent)}
  .cell.hit.best{box-shadow:inset 0 0 0 3px var(--amber),inset 0 0 0 6px color-mix(in srgb,var(--accent) 55%,transparent)}
  .cell.dim{opacity:.34}
  .cell.best{box-shadow:inset 0 0 0 3px var(--amber)}
  .cell.best::after{content:"イチオシ";position:absolute;top:-1px;left:0;right:0;font-size:8.5px;letter-spacing:.06em;color:#fff;background:var(--amber);font-weight:800;line-height:1.5}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
  .legend b{display:inline-flex;align-items:center;gap:5px;font-weight:700}
  .sym{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-weight:800}
  .sym.o{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
  .sym.t{color:var(--maybe);background:color-mix(in srgb,var(--maybe) 15%,transparent)}
  .sym.x{color:var(--faint);background:var(--surface-2)}

  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 14px}
  .stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat .k{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
  .stat .v{font-size:22px;font-weight:800;margin-top:2px}
  .stat .v small{font-size:12px;color:var(--muted);font-weight:700}
  .pick{background:linear-gradient(135deg,var(--amber-soft),transparent);border:1.5px solid var(--amber);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center}
  .pick .badge{background:var(--amber);color:#3a2600;font-weight:800;font-size:11px;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .pick .txt{font-weight:800;font-size:16px}
  .pick .txt small{display:block;font-weight:600;color:var(--muted);font-size:12px}

  .people{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
  .pill{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none}
  .pill.me{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 10px rgba(var(--heat),.35)}
  .pill.holding{background:var(--no);border-color:var(--no);color:#fff;transform:scale(1.05)}
  .filternote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:10px}
  .cmts{margin-top:12px;display:grid;gap:6px}
  .cmt{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
  .cmt b{color:var(--ink);font-weight:800;margin-right:4px}
  .cell.hi-o{outline:3px solid var(--no);outline-offset:-3px;z-index:1}
  .cell.hi-t{outline:2px dashed var(--no);outline-offset:-3px;z-index:1}

  .note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:10px;padding:10px 12px;margin-top:12px}
  .deadline{font-size:13px;font-weight:700}
  .deadline.over{color:var(--no)}

  .actionbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .actionbar .inner{max-width:680px;margin:0 auto;display:flex;gap:10px;align-items:center}

  .hidden{display:none!important}
  .divider{height:1px;background:var(--line);margin:18px 0}
  .subtle{color:var(--muted);font-size:13px}

  #toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:100;box-shadow:var(--shadow)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .pop-back{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:80;display:grid;place-items:end center}

<body>
<header class="app">
  <div class="head-in">
    <div class="logo" role="button" tabindex="0">
      <div class="mark"></div>
      <div class="name">スキマ<small>SUKIMA</small></div>
    </div>
    <div class="spacer"></div>
    <button class="theme-btn" id="themeBtn" title="テーマ切り替え" aria-label="テーマ切り替え">◐</button>
  </div>
</header>

<main class="wrap" id="app"></main>

<div id="bar"></div>
<div id="toast"></div>
<div id="pop"></div>

<script>
"use strict";
/* ---------- utilities ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,a={},...kids)=>{const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else if(k==="html")e.innerHTML=a[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]);else if(a[k]!=null)e.setAttribute(k,a[k]);}for(const kk of kids.flat())if(kk!=null)e.append(kk.nodeType?kk:document.createTextNode(kk));return e;};
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function b64u(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function ub64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return decodeURIComponent(escape(atob(s)));}
/* 暗号学的乱数によるID生成（Math.randomは推測可能なため使わない） */
function rid(n=6){const a="abcdefghijklmnopqrstuvwxyz0123456789";let s="";const b=new Uint8Array(n*2);while(s.length<n){crypto.getRandomValues(b);for(const v of b){if(s.length>=n)break;if(v<252)s+=a[v%36];}}return s;}
const pad = n=>String(n).padStart(2,"0");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1900);}
async function copy(text){try{await navigator.clipboard.writeText(text);return true;}catch(e){const ta=el("textarea",{});ta.value=text;document.body.append(ta);ta.select();try{document.execCommand("copy");}catch(_){}ta.remove();return true;}}
const WD=["月","火","水","木","金","土","日"];        // 日付ラベル用（月始まり index=(getDay+6)%7）
const CAL_WD=["日","月","火","水","木","金","土"];      // カレンダー表示用（日曜始まり index=getDay）
const isoLocal = d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function fmtDate(iso){const d=new Date(iso+"T00:00:00");return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[(d.getDay()+6)%7]+")";}

/* ---------- event pack/unpack (compact URL) ---------- */
/* dc は「確定した枠の配列」。旧バージョンは単一オブジェクトだったので、読み込み時に配列へ正規化する */
function normDecs(dc){
  if(!dc)return [];
  const a=Array.isArray(dc)?dc:[dc];
  return a.filter(d=>d&&d.d&&d.s!=null&&d.e!=null&&Number(d.e)>Number(d.s))
          .map(d=>({d:d.d,s:Number(d.s),e:Number(d.e)}))
          .sort((x,y)=>x.d===y.d?x.s-y.s:(x.d<y.d?-1:1));
}
function packEvent(ev){const ds=normDecs(ev.decisions);return {v:2,i:ev.id,t:ev.title,n:ev.note||"",D:ev.cols.map(c=>c.date),S:ev.rows.map(r=>[r.label,r.h,r.m||0]),d:ev.deadline||"",dc:ds.length?ds:null,ac:ev.allowConfirm?1:0,ak:ev.adminHash||""};}
function unpackEvent(p){
  const cols=(p.D||[]).map(iso=>{const dt=new Date(iso+"T00:00:00");return {label:(dt.getMonth()+1)+"/"+dt.getDate(),sub:WD[(dt.getDay()+6)%7],date:iso};});
  const rows=(p.S||[]).map(s=>({label:s[0],h:s[1],m:s[2]||0}));
  return {v:2,id:p.i||rid(),title:p.t||"",note:p.n||"",mode:"date",cols,rows,deadline:p.d||"",decisions:normDecs(p.dc),allowConfirm:!!p.ac,adminHash:p.ak||"",createdAt:0};
}
const encEvent = ev=>b64u(JSON.stringify(packEvent(ev)));
const decEvent = s=>unpackEvent(JSON.parse(ub64u(s)));
const encAns = a=>b64u(JSON.stringify(a));
const decAns = s=>JSON.parse(ub64u(s));

/* ================= バックエンド設定（Supabase）=================
   リアルタイム集計を使うには、下の2つを自分のSupabaseプロジェクトの値に置き換える。
   空のままなら「この端末内だけで動くオフライン版」として動作する。
   ※ 必ず「anon public」キーを使う。「service_role」キーは絶対に貼らないこと。 */
const SUPABASE_URL = "https://xujfvxqbcqdmhmvberdi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1amZ2eHFiY3FkbWhtdmJlcmRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNjY0NDAsImV4cCI6MjA5OTc0MjQ0MH0.MMTNGnO5crPL_WwoW01hKYOwHktIzq-eeIkirIh3cI8";
/* このファイルに秘密情報は一切含まれない（anonキーは公開前提の識別子）。
   認可判定・オーナー合言葉の照合はすべてサーバー側（supabase-secure.sql の
   RPC関数）で行う。テーブルへの直接アクセスは遮断済み。 */
/* ============================================================== */
const remoteEnabled = ()=>!!(SUPABASE_URL && SUPABASE_ANON_KEY);
function sbHeaders(extra){return Object.assign({apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json"},extra||{});}
function sbBase(){return SUPABASE_URL.trim().replace(/\/+$/,"").replace(/\/rest\/v1$/,"");}
/* このファイルのビルド識別子。デプロイが反映されたかを画面で確認できるようにする
   （キャッシュに残った旧版と新版を、見た目でなく事実で切り分けるため） */
const BUILD="v7 (2026-11-08)";
/* 直近の通信エラー（診断画面で原因を特定するために保持。秘密情報は入らない） */
let LAST_ERR=null;
/* すべての通信は認可チェック内蔵のRPC経由（テーブル直アクセスは行わない） */
async function rpc(fn,args){
  let r;
  try{ r=await fetch(sbBase()+"/rest/v1/rpc/"+fn,{method:"POST",headers:sbHeaders(),body:JSON.stringify(args||{})}); }
  catch(netErr){ LAST_ERR={fn,status:0,code:"network",message:"サーバーに接続できませんでした（通信環境かURL設定）"}; throw Object.assign(new Error("rpc "+fn+" network"),LAST_ERR); }
  const t=await r.text();
  if(!r.ok){
    let body={};try{body=t?JSON.parse(t):{};}catch(e){body={message:(t||"").slice(0,200)};}
    LAST_ERR={fn,status:r.status,code:body.code||"",message:body.message||"",hint:body.hint||""};
    throw Object.assign(new Error("rpc "+fn+" "+r.status),LAST_ERR);
  }
  return t?JSON.parse(t):null;
}
/* サーバーの生エラーを、原因が分かる日本語に翻訳する */
function rpcReason(e){
  if(!e)return "原因不明のエラーです";
  if(e.status===0)return "サーバーに接続できません（通信環境かURL設定を確認）";
  if(e.status===404||e.code==="PGRST202")return "サーバー側のSQLが未適用か、APIのキャッシュが古い状態です";
  if(e.status===401||e.status===403)return "サーバーに拒否されました（キーまたは権限の設定）";
  if(e.message)return "サーバーの応答: "+e.message;
  return "エラー "+e.status;
}
async function remoteCreateEvent(ev,adminKey){await rpc("sukima_create_event",{p_id:ev.id,p_data:packEvent(ev),p_admin_key:adminKey});}
async function remoteLoadEvent(id){const d=await rpc("sukima_get_event",{p_id:id});return d?unpackEvent(d):null;}
async function remoteUpsertAnswer(eventId,name,cells,comment){await rpc("sukima_upsert_answer",{p_event_id:eventId,p_name:name,p_cells:cells,p_comment:comment||""});}
async function remoteDeleteAnswer(eventId,name){await rpc("sukima_delete_answer",{p_event_id:eventId,p_name:name,p_admin_key:myAdminSecret(eventId)||null,p_owner_pass:ownerToken()||null});}
async function remoteLoadAnswers(eventId){const rows=await rpc("sukima_get_answers",{p_event_id:eventId})||[];const out={};rows.forEach(x=>out[x.name]={cells:x.cells||{},comment:x.comment||""});return out;}
async function remoteSetDecision(id,dec){await rpc("sukima_set_decision",{p_id:id,p_dec:dec,p_admin_key:myAdminSecret(id)||null,p_owner_pass:ownerToken()||null});}
async function remoteSetAllow(id,allow){await rpc("sukima_set_allow",{p_id:id,p_allow:!!allow,p_admin_key:myAdminSecret(id)||null,p_owner_pass:ownerToken()||null});}
/* ---- オーナー画面用（合言葉の照合後に発行された短期トークンで一覧・明細・削除） ---- */
async function remoteListEvents(){return await rpc("sukima_owner_list",{p_pass:ownerToken()})||[];}
async function remoteAllAnswerMeta(){return await rpc("sukima_owner_answer_meta",{p_pass:ownerToken()})||[];}
async function remoteEventAnswers(eventId){return await rpc("sukima_owner_event_answers",{p_pass:ownerToken(),p_event_id:eventId})||[];}
async function remoteDeleteEvent(id){await rpc("sukima_owner_delete_event",{p_pass:ownerToken(),p_id:id});}
async function remoteEventLog(eventId){try{return await rpc("sukima_owner_log",{p_pass:ownerToken(),p_event_id:eventId});}catch(e){return null;}}
/* 操作ログはDBの実データ変更トリガーで記録する（ブラウザーから任意投稿しない）。 */

/* ---------- unified data layer (in-memory ANS) ---------- */
let ANS={};
const FILTER=new Set();   // 集計画面で絞り込み中の回答者名（空＝全員）
async function fetchAnswers(){if(!EV)return ANS={};if(remoteEnabled()){try{ANS=await remoteLoadAnswers(EV.id);}catch(e){toast("集計の取得に失敗しました");}}else{ANS=loadAnswers(EV.id);}return ANS;}
async function putAnswer(name,cells,comment){if(remoteEnabled()){await remoteUpsertAnswer(EV.id,name,cells,comment);}else{const s=loadAnswers(EV.id);s[name]={cells,comment,ts:Date.now()};saveAnswers(EV.id,s);}ANS[name]={cells,comment};}
async function delAnswer(name){if(remoteEnabled()){await remoteDeleteAnswer(EV.id,name);}else{const s=loadAnswers(EV.id);delete s[name];saveAnswers(EV.id,s);}delete ANS[name];}

/* ---------- マイ履歴：この端末で作成／回答した調整（他人には見えない） ---------- */
const HIST_KEY="sukima:history";
function loadHistory(){try{const a=JSON.parse(localStorage.getItem(HIST_KEY)||"[]");return Array.isArray(a)?a:[];}catch(e){return[];}}
function saveHistory(a){try{localStorage.setItem(HIST_KEY,JSON.stringify(a.slice(0,60)));}catch(e){}}
function touchHistory(p){
  if(!p||!p.id)return;
  const a=loadHistory(),i=a.findIndex(x=>x.id===p.id),now=Date.now();
  const prev=i>=0?a[i]:null;if(i>=0)a.splice(i,1);
  a.unshift({id:p.id,title:p.title||(prev&&prev.title)||"",h:p.h||(prev&&prev.h)||"",role:(prev&&prev.role==="creator")?"creator":(p.role||(prev&&prev.role)||"respondent"),ts:now});
  saveHistory(a);
}
function removeHistory(id){saveHistory(loadHistory().filter(x=>x.id!==id));}
function currentHash(){return location.hash.replace(/^#/,"");}
/* 履歴機能より前に作った調整を、端末に残る印から復元して一覧に載せる（初回のみ） */
let BACKFILLED=false;
async function backfillHistory(){
  if(BACKFILLED)return;BACKFILLED=true;
  const known=new Set(loadHistory().map(x=>x.id));const found=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||"";
    let m=k.match(/^sukima:admin:(.+)$/);if(m){found.push({id:m[1],role:"creator"});continue;}
    m=k.match(/^sukima:ans:(.+)$/);if(m)found.push({id:m[1],role:"respondent"});
  }}catch(e){return;}
  const add=found.filter(f=>!known.has(f.id));
  if(!add.length)return;
  for(const f of add){
    let title="";
    if(remoteEnabled()){try{const ev=await remoteLoadEvent(f.id);if(!ev)continue;title=ev.title;}catch(e){continue;}}
    touchHistory({id:f.id,title:title,h:remoteEnabled()?"id="+f.id:"",role:f.role});
  }
  if(SCREEN==="home")render();
}

/* ---------- 作成者（管理者）判定 ----------
   1) 作成した端末には印を付ける
   2) 管理者リンク（#id=..&k=…）を開いた端末でも、合鍵が一致すれば管理者になる
      （LINEのアプリ内ブラウザは保存領域が別なので、端末をまたぐ手段が必要）
   3) オーナー解錠済みなら常に管理者                                        */
const adminKey = id=>"sukima:admin:"+id;
const adminSecretKey = id=>"sukima:ak:"+id;
function markAdmin(id){try{localStorage.setItem(adminKey(id),"1");}catch(e){}}
function isAdmin(){return !!(EV&&(localStorage.getItem(adminKey(EV.id))==="1"||ownerUnlocked()));}
function myAdminSecret(id){try{return localStorage.getItem(adminSecretKey(id))||"";}catch(e){return "";}}
/* この端末で調整を作ったことがあるか（＝運営側の画面を出してよい端末か） */
function hasEverCreated(){
  try{
    if(ownerUnlocked())return true;
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf("sukima:admin:")===0&&localStorage.getItem(k)==="1")return true;}
  }catch(e){}
  return false;
}
async function claimAdminFromKey(k){
  if(!k||!EV)return false;
  try{
    let ok=false;
    if(remoteEnabled())ok=await rpc("sukima_check_admin",{p_id:EV.id,p_key:k})===true;  // 照合はサーバー側
    else ok=!!EV.adminHash&&await sha256hex(k)===EV.adminHash;                            // オフライン版のみ端末内で照合
    if(ok){markAdmin(EV.id);try{localStorage.setItem(adminSecretKey(EV.id),k);}catch(e){}return true;}
  }catch(e){}
  return false;
}

/* ---------- theme ---------- */
const THEME_KEY="sukima:theme";
function applyTheme(t){if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme");}
(function(){applyTheme(localStorage.getItem(THEME_KEY)||"");})();
$("#themeBtn").addEventListener("click",()=>{const cur=document.documentElement.getAttribute("data-theme");const sysDark=matchMedia("(prefers-color-scheme:dark)").matches;const eff=cur||(sysDark?"dark":"light");const next=eff==="dark"?"light":"dark";localStorage.setItem(THEME_KEY,next);applyTheme(next);});

/* ---------- storage ---------- */
const nameKey="sukima:name";
/* 名前は「調整ごと」にも覚える。端末に1個だけだと、別の調整に違う表記で回答したときに
   前の調整で自分の回答を見失う。グローバル側は新しい調整の初期値として残す。 */
const nameKeyFor = id=>"sukima:name:"+id;
function myNameFor(id){try{return (localStorage.getItem(nameKeyFor(id))||localStorage.getItem(nameKey)||"").trim();}catch(e){return "";}}
function rememberName(id,nm){try{localStorage.setItem(nameKeyFor(id),nm);localStorage.setItem(nameKey,nm);}catch(e){}}
/* サーバーにある回答の中から「自分のもの」を探す。見つかればその登録名を返す。
   端末のメモが消えていると手がかりが無いので空を返す（＝回答画面で名前から復旧してもらう）。 */
function resolveMyAnswer(store,id){
  const s=store||{},want=myNameFor(id);
  if(!want)return "";
  if(s[want])return want;
  return Object.keys(s).find(n=>n.trim()===want)||"";
}
const ansKey = id=>"sukima:ans:"+id;
function loadAnswers(id){try{return JSON.parse(localStorage.getItem(ansKey(id))||"{}");}catch(e){return{};}}
function saveAnswers(id,obj){localStorage.setItem(ansKey(id),JSON.stringify(obj));}

/* ---------- state / routing ---------- */
let EV=null, SCREEN="home", SUPPRESS_HASH=false;
function cols(ev){return ev.cols;}
function rows(ev){return ev.rows;}
function shareURL(){const base=location.href.split("#")[0];return remoteEnabled()?base+"#id="+EV.id:base+"#e="+encEvent(EV);}
/* 自分用（管理者）リンク：別の端末やLINEでも作成者として操作できる。人には送らない */
function adminURL(){const s=myAdminSecret(EV.id);return s?shareURL()+"&k="+encodeURIComponent(s):"";}
/* いま見ている画面をURLに残す。ページを更新しても同じ画面に戻ってこられるようにするため。
   （調整に紐づく画面だけが対象。ホーム等はURLを持たない） */
function syncHashScreen(){
  if(!EV)return;
  const h=location.hash.replace(/^#/,"");
  if(!/[#&]?(id|e)=/.test(h))return;
  /* respond も明示的に書く。そうしないと「回答済みなら集計から開く」既定と衝突して、
     回答画面で更新したのに集計へ飛ばされてしまう（URLに書いてあるほうを常に優先する） */
  const want=(SCREEN==="result"||SCREEN==="share")?SCREEN:"respond";
  const next=h.replace(/&v=[a-z]+/,"")+"&v="+want;
  if(next!==h){SUPPRESS_HASH=true;location.hash=next;}
  touchHistory({id:EV.id,title:EV.title,h:currentHash()});
}
function go(screen){stopPoll();if(PROXY&&screen!=="respond")endProxy();if(screen!=="result")pickReset();MY_DIRTY=false;SCREEN=screen;render();syncHashScreen();window.scrollTo(0,0);}
async function nav(screen){stopPoll();if(PROXY&&screen!=="respond")endProxy();if(screen!=="result")pickReset();FILTER.clear();MY_DIRTY=false;SCREEN=screen;render();syncHashScreen();window.scrollTo(0,0);try{await fetchAnswers();}catch(e){}if(SCREEN===screen){render();if(screen==="result")startPoll();}}
let POLL=null;
function startPoll(){stopPoll();if(!remoteEnabled())return;POLL=setInterval(async()=>{if(SCREEN!=="result"){stopPoll();return;}if(PICK.on)return;const before=JSON.stringify(ANS);await fetchAnswers();if(SCREEN==="result"&&JSON.stringify(ANS)!==before){const y=window.scrollY;render();window.scrollTo(0,y);}},6000);}
function stopPoll(){if(POLL){clearInterval(POLL);POLL=null;}}
async function boot(){
  const h=location.hash;const mId=h.match(/[#&]id=([^&]+)/);const mE=h.match(/[#&]e=([^&]+)/);
  if(/[#&]diag\b/.test(h)){SCREEN="diag";render();diagRun();return;}
  if(/[#&]owner\b/.test(h)){SCREEN="owner";render();ownerLoad();return;}
  const mV=h.match(/[#&]v=([a-z]+)/);
  if(mId){
    if(remoteEnabled()){SCREEN="loading";render();try{EV=await remoteLoadEvent(mId[1]);}catch(e){EV=null;}if(EV){await fetchAnswers();SCREEN="respond";}else SCREEN="notfound";}
    else SCREEN="notfound";
  }else if(mE){try{EV=decEvent(mE[1]);if(EV&&EV.cols&&EV.cols.length){await fetchAnswers();SCREEN="respond";}else SCREEN="home";}catch(e){SCREEN="home";}}
  else SCREEN="home";
  const mK=h.match(/[#&]k=([^&]+)/);
  if(mK&&EV)await claimAdminFromKey(decodeURIComponent(mK[1]));
  if(EV&&SCREEN==="respond"){
    /* URLに画面が書いてあればそれを復元。書いていなくても、この端末で回答済みなら
       集計結果から始める（毎回また入力画面に戻される手間をなくす） */
    if(mV&&(mV[1]==="result"||mV[1]==="share"))SCREEN=mV[1];
    else if(mV&&mV[1]==="respond"){/* URLの指定を尊重してそのまま回答画面 */}
    else if(alreadyAnswered())SCREEN="result";
  }
  if(EV&&SCREEN!=="notfound")touchHistory({id:EV.id,title:EV.title,h:currentHash()});
  render();
  if(SCREEN==="result")startPoll();
}
/* この端末の回答がすでにこの調整に入っているか */
function alreadyAnswered(){
  return !!(EV&&resolveMyAnswer(ANS,EV.id));
}
window.addEventListener("hashchange",()=>{if(SUPPRESS_HASH){SUPPRESS_HASH=false;return;}boot();});

/* =========================================================
   HOME
========================================================= */
function viewHome(app){
  app.append(
    el("section",{class:"card"},
      el("div",{class:"eyebrow"},"みんなの空きが、一目でわかる"),
      el("h1",{style:"font-size:27px;margin:8px 0 6px;line-height:1.25"},"リンクを送るだけ。ログインも登録もいらない日程調整。"),

function calStart(){const t=new Date();t.setHours(0,0,0,0);const sun=new Date(t);sun.setDate(t.getDate()-t.getDay()+CAL_OFFSET*7);return sun;}
function calDays(){const start=calStart();const today=isoLocal(new Date());const out=[];for(let i=0;i<CAL_WEEKS*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=isoLocal(d);out.push({iso,day:d.getDate(),month:d.getMonth()+1,past:iso<today,today:iso===today});}return out;}
function fmtMD(iso){const d=new Date(iso+"T00:00:00");return (d.getMonth()+1)+"/"+d.getDate();}

/* カレンダーを指でなぞって選択／解除（イベント委譲でhostに1回だけ付ける） */
function enableCalPaint(host){
  let painting=false,mode=null,mt=false,lastY=0,startCell=null,moved=false;
  const avgY=t=>{let s=0;for(const p of t)s+=p.clientY;return s/t.length;};
  const reset=()=>{painting=false;mode=null;startCell=null;moved=false;};
  // 2本指＝画面を上下にスクロール。触れた瞬間に保留中の選択を破棄し、誤選択を防ぐ
  host.addEventListener("touchstart",e=>{if(e.touches.length>=2){mt=true;reset();lastY=avgY(e.touches);}},{passive:true});
  host.addEventListener("touchmove",e=>{if(mt&&e.touches.length>=2){const y=avgY(e.touches);window.scrollBy(0,lastY-y);lastY=y;}},{passive:true});
  host.addEventListener("touchend",e=>{if(e.touches.length<2)mt=false;},{passive:true});
  const dayAt=(x,y)=>{const el2=document.elementFromPoint(x,y);const d=el2&&el2.closest?el2.closest(".d"):null;return d&&!d.classList.contains("past")?d:null;};
  const applyTo=d=>{const iso=d.getAttribute("data-iso");if(mode){CRE.dates.add(iso);d.classList.add("sel");}else{CRE.dates.delete(iso);d.classList.remove("sel");}updateSelInfo();};
  // pointerdownでは即選択せず「保留」。指1本の移動 or 離した時に確定（2本指なら破棄済み）
  host.addEventListener("pointerdown",e=>{if(mt)return;const d=e.target.closest(".d");if(!d||d.classList.contains("past"))return;e.preventDefault();mode=!CRE.dates.has(d.getAttribute("data-iso"));startCell=d;moved=false;painting=true;try{host.setPointerCapture(e.pointerId);}catch(_){}});
  host.addEventListener("pointermove",e=>{if(mt||!painting)return;if(!moved){applyTo(startCell);moved=true;}const d=dayAt(e.clientX,e.clientY);if(d){const iso=d.getAttribute("data-iso"),has=CRE.dates.has(iso);if((mode&&!has)||(!mode&&has))applyTo(d);}});
  host.addEventListener("pointerup",()=>{if(!mt&&painting&&!moved&&startCell)applyTo(startCell);reset();});
  host.addEventListener("pointercancel",reset);
}
function toggleWeekday(gd){const days=calDays().filter(d=>!d.past&&new Date(d.iso+"T00:00:00").getDay()===gd);const allSel=days.length&&days.every(d=>CRE.dates.has(d.iso));days.forEach(d=>{if(allSel)CRE.dates.delete(d.iso);else CRE.dates.add(d.iso);});if(window.__refreshCal)window.__refreshCal();}

let MY_BACKUP=null;    // 代理入力の間、自分の入力内容を退避
function startProxy(name){MY_BACKUP={...MY,cells:{...MY.cells}};PROXY=name;MY={name,cells:{...((ANS[name]||{}).cells||{})},comment:(ANS[name]||{}).comment||"",eventId:EV?EV.id:"",loadedFrom:name};nav("respond");}
function endProxy(){if(MY_BACKUP){MY=MY_BACKUP;MY_BACKUP=null;}PROXY=null;}
/* 保存済みの回答を自分の入力欄に読み込む。どれを読み込んだかを覚えておき、
   別人の回答を黙って上書きする事故を防ぐ材料にする。 */
function loadMyAnswerFrom(store,name){
  const a=(store||{})[name];if(!a)return false;
  MY.name=name;MY.cells={...(a.cells||{})};MY.comment=a.comment||"";
  MY.loadedFrom=name;MY.eventId=EV?EV.id:MY.eventId;
  return true;
}
function viewRespond(app){
  const store=ANS;
  if(PROXY){/* 代理入力：MY は startProxy で相手ぶんに差し替え済み */}
  // 保存済み回答の読み込みは「画面に入った直後（未編集）」のみ。編集後の再描画で上書きしない
  else{
    // 別の調整で塗った内容を持ち越さない（MY は画面をまたいで生き続けるため）
    if(MY.eventId!==EV.id){MY={name:"",cells:{},comment:"",eventId:EV.id,loadedFrom:""};MY_DIRTY=false;}
    if(!MY.name)MY.name=myNameFor(EV.id);
    if(!MY_DIRTY){
      const typed=(MY.name||"").trim();
      const mine=resolveMyAnswer(store,EV.id)||(store[typed]?typed:"");

  }
  const overdue=isOverdue();
  let nameFld;

    nameFld=el("div",{class:"fld"},el("span",{class:"lbl"},"代理入力する相手"),el("div",{class:"proxyname"},"👤 "+esc(PROXY)+" さんの代わりに入力中"));
  }else{

    /* 名前を入力し終えた時点で、同じ名前の回答があれば呼び戻す。
       端末のメモが消えた人でも、名前を入れるだけで前回の内容に戻れるようにするため。 */
    ni.addEventListener("change",()=>{
      const nm=(ni.value||"").trim();
      if(!nm||MY_DIRTY||MY.loadedFrom===nm||!store[nm])return;
      loadMyAnswerFrom(store,nm);rememberName(EV.id,nm);render();
      toast("「"+nm+"」さんの前回の回答を読み込みました");
    });
    nameFld=el("label",{class:"fld"},el("span",{class:"lbl"},"あなたの名前"),ni);
  }
  const _db=decisionBanner();if(_db)app.append(_db);
  app.append(el("section",{class:"card"},
    el("div",{class:"eyebrow"},PROXY?"代理で入力（作成者）":"空いてる時間を教えて"),
    el("h1",{style:"font-size:20px;margin:6px 0 2px"},esc(EV.title)),
    EV.note?el("p",{class:"lead"},esc(EV.note)):null,
    deadlineLine(),
    nameFld,
    el("p",{class:"subtle",style:"margin:8px 0 0"},"マスをタップで ○→△→× と切り替え。指でなぞれば一気に塗れます。")
  ));
  /* 端末のメモが消えた人（別ブラウザ・iOSの自動削除など）が自分の回答を取り戻すための保険。
     自分の回答を特定できているときは出さない。 */
  if(!PROXY&&!MY.loadedFrom&&!resolveMyAnswer(store,EV.id)){
    const names=Object.keys(store);
    if(names.length)app.append(recoverCard(store,names));
  }
  app.append(el("section",{class:"card"},
    legend(),
    el("div",{class:"bulkrow"},
      el("span",{class:"subtle",style:"font-weight:700"},"一括："),
      el("button",{class:"btn ghost sm",type:"button",onclick:()=>setAllCells(2)},"全部 ○"),
      el("button",{class:"btn ghost sm",type:"button",onclick:()=>setAllCells(1)},"全部 △"),
      el("button",{class:"btn ghost sm clearbtn",id:"gridClear",type:"button",onclick:()=>setAllCells(0)},"クリア")
    ),
    el("p",{class:"subtle",style:"margin:2px 0 8px"},slotHeadBlank()?"日付の見出しをタップすると、その日をまとめて ○→△→× に切り替えできます。":"日付・時間帯の見出しをタップすると、その日／その時間帯をまとめて ○→△→× に切り替えできます。"),
    buildGrid("respond"),
    el("label",{class:"fld"},el("span",{class:"lbl"},"ひとこと ",el("span",{class:"opt"},"任意")),textarea(MY.comment,"例）金曜は20時以降なら🙆",v=>{MY_DIRTY=true;MY.comment=v;}))
  ));
  renderBar([
    el("button",{class:"btn ghost sm",onclick:()=>{if(PROXY)endProxy();nav("result");}},PROXY?"やめる":"集計を見る"),
    el("div",{style:"flex:1"}),
    PROXY?null:el("button",{class:"btn ghost sm",onclick:()=>go("home")},"ホーム"),
    el("div",{style:"flex:1"}),
    el("button",{class:"btn primary",onclick:submitAnswer},PROXY?"代理で保存 →":(overdue?"締切後だけど回答":"回答を保存 →"))
  ].filter(Boolean));
  updateClearState();
}
function deadlineLine(){if(!EV.deadline)return null;const over=isOverdue();return el("div",{class:"deadline"+(over?" over":""),style:"margin-top:8px"},(over?"⏰ 締切を過ぎています（":"⏳ 回答締切：")+fmtDate(EV.deadline)+(over?"）":""));}
function isOverdue(){if(!EV.deadline)return false;const d=new Date(EV.deadline+"T23:59:59");return Date.now()>d.getTime();}
function legend(){return el("div",{class:"legend"},el("b",{},el("span",{class:"sym o"},"○"),"行ける"),el("b",{},el("span",{class:"sym t"},"△"),"たぶん/条件付き"),el("b",{},el("span",{class:"sym x"},"×"),"無理（空欄）"));}
/* 回答済みの人の一覧から自分のものを選んで呼び戻す（名前の表記を思い出せなくても復旧できる） */

function confirmRecover(store,name){

/* 同じ名前の回答がすでにあるのに、それを読み込まずに保存しようとしている＝
   以前の回答を今の入力（白紙かもしれない）で潰す事故。保存の前に必ず確認する。 */

async function submitAnswer(){
  const nm=(PROXY||MY.name||"").trim();
  if(!nm){toast("名前を入れてください");return;}
  if(!PROXY&&ANS[nm]&&MY.loadedFrom!==nm){confirmOverwrite(nm);return;}
  await saveAnswerNow(nm);
}
async function saveAnswerNow(nm){
  if(!PROXY)rememberName(EV.id,nm);
  const wasEdit=!!ANS[nm];
  try{await putAnswer(nm,MY.cells,MY.comment.trim());}catch(e){toast("保存に失敗しました。通信環境を確認してください");return;}

  touchHistory({id:EV.id,title:EV.title,h:currentHash(),role:wasProxy?undefined:"respondent"});
  if(wasProxy)endProxy();

/* ---------- grid builder ---------- */
/* 表の向き。スマホは縦に長いので、候補日と時間帯のうち「数が多いほう」を縦に並べる。
   例) 終日 × 8日 → 8行1列（横スクロール不要）／9-21時 × 3日 → 12行3列（従来どおり）。
   セルのキーは常に "時間帯番号_日付番号" のままなので、保存済みの回答・集計には一切影響しない。 */
function gridFlipped(){return cols(EV).length > rows(EV).length;}
/* 「終日」のように1つしかない時間帯の見出しは情報量がないので出さない（場所も取る） */
function slotHeadBlank(){const rs=rows(EV);return rs.length===1&&rs[0].label==="終日";}

function buildGrid(kind){
  const flip=gridFlipped();
  const xs=flip?rows(EV):cols(EV);          // 横に並ぶもの
  const ys=flip?cols(EV):rows(EV);          // 縦に並ぶもの
  const keyOf=(xi,yi)=>flip?(xi+"_"+yi):(yi+"_"+xi);
  const blankX=flip&&slotHeadBlank();       // 横軸が「終日」だけ＝見出しを空にする
  const blankY=!flip&&slotHeadBlank();
  const fillX=flip?fillRow:fillCol;         // 横軸の見出しタップ
  const fillY=flip?fillCol:fillRow;         // 縦軸の見出しタップ
  const head=(o,blank)=>blank?[""]:[o.label,o.sub?el("small",{},o.sub):null];

  const wrap=el("div",{class:"matrix-wrap"});
  const table=el("table",{class:"mx"});
  const noHead=blankX;                       // 横軸の見出しが空＝ヘッダー行に何も無い
  const thead=el("thead");const htr=el("tr");
  htr.append(el("th",{class:"corner"},""));
  xs.forEach((o,xi)=>{
    const th=kind==="respond"
      ? el("th",{class:"taph"+(blankX?" blank":""),title:"まとめて ○→△→×",onclick:()=>fillX(xi)},...head(o,blankX))
      : el("th",{class:blankX?"blank":""},...head(o,blankX));
    htr.append(th);
  });
  if(!noHead){thead.append(htr);table.append(thead);}

  const tbody=el("tbody");
  const store=kind==="result"?ANS:null;
  let agg=null,best=-1;
  if(kind==="result"){agg=computeAgg(store);best=agg.best;}
  const heatVar=getComputedStyle(document.documentElement).getPropertyValue("--heat");
  ys.forEach((o,yi)=>{
    const tr=el("tr");
    tr.append(kind==="respond"
      ? el("th",{class:"taph"+(blankY?" blank":""),title:"まとめて ○→△→×",onclick:()=>fillY(yi)},...head(o,blankY))
      : el("th",{class:blankY?"blank":""},...head(o,blankY)));
    xs.forEach((_,xi)=>{
      const key=keyOf(xi,yi);
      if(kind==="respond"){
        const v=MY.cells[key]||0;
        tr.append(el("td",{class:"cell paint v"+v,"data-k":key},symbol(v)));
      }else{
        const a=agg.cells[key];
        const hit=hlActive()&&hlMatch(a);
        const td=el("td",{class:"cell"+(agg.score[key]===best&&best>0?" best":"")+(hlActive()?(hit?" hit":" dim"):"")+(PICK.on&&PICK.set.has(key)?" picked":""),"data-k":key});
        const ratio=agg.total?agg.score[key]/agg.total:0;
        td.style.background="rgba("+heatVar+","+(ratio*0.55).toFixed(3)+")";
        td.append(el("span",{style:"font-weight:800;font-size:14px;color:"+(ratio>0.55?"var(--accent)":"var(--ink)")},a.o?("○"+a.o):"·"));
        if(a.t)td.append(el("span",{class:"who"},"△"+a.t));
        const [ri,ci]=key.split("_").map(Number);
        td.addEventListener("click",()=>{if(PICK.on){togglePick(key);}else{showCellDetail(key,rows(EV)[ri],cols(EV)[ci]);}});
        tr.append(td);
      }
    });
    tbody.append(tr);
  });
  table.append(tbody);wrap.append(table);
  const box=el("div",{class:"gridbox"});box.append(wrap);
  if(kind==="respond"){
    enablePaint(wrap);
    const step=()=>Math.round(wrap.clientWidth*0.7);
    const larr=el("div",{class:"scroll-arrow left","aria-label":"左へ",onclick:()=>wrap.scrollBy({left:-step(),behavior:"smooth"})},"‹");
    const rarr=el("div",{class:"scroll-arrow right","aria-label":"右へ",onclick:()=>wrap.scrollBy({left:step(),behavior:"smooth"})},"›");
    const hint=el("div",{class:"gridhint"},"1本指でなぞって入力できます");
    box.append(larr,rarr,hint);
    const upd=()=>{
      const of=wrap.scrollWidth>wrap.clientWidth+4;
      larr.classList.toggle("show",of&&wrap.scrollLeft>4);
      rarr.classList.toggle("show",of&&wrap.scrollLeft+wrap.clientWidth<wrap.scrollWidth-4);
      // 横スクロールが要らない形なら、案内も出さない（余白でそのまま上下にスクロールできる）
      hint.textContent=of?"1本指でなぞって入力／2本指で表を左右にスクロール":"1本指でなぞって入力できます";
    };
    // 矢印を「今見えている表の縦中央」に追従させる（縦に長い表でも常に視界に入る）
    const place=()=>{const r=wrap.getBoundingClientRect();const vh=window.innerHeight||document.documentElement.clientHeight;const top=Math.max(r.top,8),bot=Math.min(r.bottom,vh-72);const rel=(top+bot)/2-r.top;larr.style.top=rarr.style.top=rel+"px";};
    const onScroll=()=>{if(!document.body.contains(larr)){window.removeEventListener("scroll",onScroll);return;}place();upd();};
    wrap.addEventListener("scroll",upd);window.addEventListener("scroll",onScroll,{passive:true});
    requestAnimationFrame(()=>{fitCellWidth(wrap,table,flip,xs.length);place();upd();});
    if(!noHead)attachStickyHeader(box,wrap,table,"respond",fillX);
  }else{
    const hint=el("div",{class:"gridhint",style:"display:none"},"← 横にスワイプで移動 →");
    box.append(hint);
    requestAnimationFrame(()=>{fitCellWidth(wrap,table,flip,xs.length);if(wrap.scrollWidth>wrap.clientWidth+4)hint.style.display="block";});
    if(!noHead)attachStickyHeader(box,wrap,table);
  }
  return box;
}
/* 縦長に組んだときは、表を画面いっぱいに広げない。
   右側に余白を残すことで、1本指でページを送ろうとして入力してしまう事故を防ぐ。 */
function fitCellWidth(wrap,table,flip,n){
  if(!flip||!n)return;
  const avail=wrap.clientWidth;if(!avail)return;
  const th=table.querySelector("tbody th");
  const headW=th?Math.ceil(th.getBoundingClientRect().width):56;
  const w=Math.max(56,Math.min(112,Math.floor((avail*0.78-headW)/n)));
  table.style.setProperty("--cellw",w+"px");
}

function attachStickyHeader(box,wrap,table,kind,fillX){
  const realHead=table.querySelector("thead");
  const fh=el("div",{class:"float-head"+(kind==="respond"?" tappable":"")});
  const ftable=el("table",{class:"mx"});
  ftable.append(realHead.cloneNode(true));
  fh.append(ftable);box.append(fh);
  // 回答画面：浮動ヘッダーの日付タップでも列を一括入力できるようにする
  if(kind==="respond"&&fillX)ftable.querySelectorAll("th").forEach((th,i)=>{if(i>0)th.addEventListener("click",()=>fillX(i-1));});
  const sync=()=>{
    if(!document.body.contains(fh)){window.removeEventListener("scroll",sync,true);return;}
    const ah=document.querySelector("header.app");const ahb=ah?Math.round(ah.getBoundingClientRect().bottom):0;
    const wr=wrap.getBoundingClientRect(),hr=realHead.getBoundingClientRect();
    const show=hr.top<ahb-1&&wr.bottom>ahb+hr.height+4;
    fh.classList.toggle("show",show);
    if(!show)return;
    fh.style.top=ahb+"px";
    fh.style.left=Math.round(wr.left)+"px";
    fh.style.width=Math.round(wrap.clientWidth)+"px";
    const rc=realHead.querySelectorAll("th"),fc=ftable.querySelectorAll("th");
    rc.forEach((c,i)=>{if(fc[i])fc[i].style.width=Math.round(c.getBoundingClientRect().width)+"px";});
    fh.scrollLeft=wrap.scrollLeft;
  };
  window.addEventListener("scroll",sync,true);wrap.addEventListener("scroll",sync);window.addEventListener("resize",sync);
  requestAnimationFrame(sync);
}
function symbol(v){return v===2?"○":v===1?"△":"×";}
/* 一括入力：全体／列（日付）／行（時間帯）を ○→△→× でまとめて切り替え */
function hasAnyInput(){for(const k in MY.cells)if(MY.cells[k])return true;return false;}
function updateClearState(){const b=$("#gridClear");if(b)b.classList.toggle("armed",hasAnyInput());}
function setAllCells(v){MY_DIRTY=true;rows(EV).forEach((r,ri)=>cols(EV).forEach((c,ci)=>{MY.cells[ri+"_"+ci]=v;}));render();}
function nextForKeys(keys){const allO=keys.every(k=>(MY.cells[k]||0)===2);if(allO)return 1;const allT=keys.every(k=>(MY.cells[k]||0)===1);if(allT)return 0;return 2;}
function fillCol(ci){MY_DIRTY=true;const keys=rows(EV).map((r,ri)=>ri+"_"+ci);const v=nextForKeys(keys);keys.forEach(k=>MY.cells[k]=v);render();}
function fillRow(ri){MY_DIRTY=true;const keys=cols(EV).map((c,ci)=>ri+"_"+ci);const v=nextForKeys(keys);keys.forEach(k=>MY.cells[k]=v);render();}
function enablePaint(wrap){
  let painting=false,paintVal=null,mt=false,lx=0,ly=0,startCell=null,moved=false;
  const avg=(t,a)=>{let s=0;for(const p of t)s+=p[a];return s/t.length;};
  const reset=()=>{painting=false;paintVal=null;startCell=null;moved=false;};
  // 2本指＝表を左右／画面を上下にスクロール。触れた瞬間に保留中の入力を破棄し誤入力を防ぐ
  wrap.addEventListener("touchstart",e=>{if(e.touches.length>=2){mt=true;reset();lx=avg(e.touches,"clientX");ly=avg(e.touches,"clientY");}},{passive:true});
  wrap.addEventListener("touchmove",e=>{if(mt&&e.touches.length>=2){const x=avg(e.touches,"clientX"),y=avg(e.touches,"clientY");wrap.scrollLeft+=lx-x;window.scrollBy(0,ly-y);lx=x;ly=y;}},{passive:true});
  wrap.addEventListener("touchend",e=>{if(e.touches.length<2)mt=false;},{passive:true});
  const cellAt=(x,y)=>{const e=document.elementFromPoint(x,y);return e&&e.closest?e.closest(".cell"):null;};
  const setCell=(td,v)=>{MY_DIRTY=true;const k=td.getAttribute("data-k");MY.cells[k]=v;td.className="cell paint v"+v;td.textContent=symbol(v);updateClearState();};
  const cycle=v=>v===0?2:v===2?1:0;
  // pointerdownでは即入力せず「保留」。指1本の移動 or 離した時に確定（2本指なら破棄済み）
  wrap.addEventListener("pointerdown",e=>{if(mt)return;const td=e.target.closest(".cell");if(!td)return;e.preventDefault();paintVal=cycle(MY.cells[td.getAttribute("data-k")]||0);startCell=td;moved=false;painting=true;try{wrap.setPointerCapture(e.pointerId);}catch(_){}});
  wrap.addEventListener("pointermove",e=>{if(mt||!painting)return;if(!moved){setCell(startCell,paintVal);moved=true;}const td=cellAt(e.clientX,e.clientY);if(td&&wrap.contains(td)&&(MY.cells[td.getAttribute("data-k")]||0)!==paintVal)setCell(td,paintVal);});
  wrap.addEventListener("pointerup",()=>{if(!mt&&painting&&!moved&&startCell)setCell(startCell,paintVal);reset();});
  wrap.addEventListener("pointercancel",reset);
}

/* =========================================================
   RESULT
========================================================= */
function computeAgg(store){
  store=store||ANS;
  const names=Object.keys(store).filter(n=>!FILTER.size||FILTER.has(n));const total=names.length;const cells={},score={};let best=0;
  rows(EV).forEach((r,ri)=>cols(EV).forEach((c,ci)=>{const k=ri+"_"+ci;cells[k]={o:0,t:0,x:0};score[k]=0;}));
  names.forEach(n=>{const cel=store[n].cells||{};for(const k in cells){const v=cel[k]||0;if(v===2){cells[k].o++;score[k]+=1;}else if(v===1){cells[k].t++;score[k]+=0.5;}else cells[k].x++;}});
  for(const k in score)if(score[k]>best)best=score[k];
  return {cells,score,total,names,best};
}
/* ===== 候補をカレンダーに入れる（確定前・全員が使える） =====
   長期間の調整では、確定を待たずに「この辺が空いていそう」を自分の予定表に
   仮押さえしたい。誰でも枠を選んで、まとめてカレンダーに入れられるようにする。 */
const PICK={on:false,set:new Set(),title:null};
function pickReset(){PICK.on=false;PICK.set.clear();PICK.title=null;}

/* 選んだマスを、日付ごとに「つながっている時間帯」へまとめる
   （1時間刻みで4コマ選んだら、4件ではなく1件の予定にする） */
function pickSpans(){
  const byDate={};
  PICK.set.forEach(k=>{
    const [ri,ci]=k.split("_").map(Number);
    const c=cols(EV)[ci];const r=rows(EV)[ri];
    if(!c||!r)return;
    (byDate[c.date]=byDate[c.date]||[]).push(ri);
  });
  const out=[];
  Object.keys(byDate).sort().forEach(date=>{
    const list=byDate[date].sort((a,b)=>a-b);
    let s=null,e=null,prev=null;
    list.forEach(ri=>{
      if(prev!==null&&rowMin(ri)===e){e=rowEndMin(ri);prev=ri;return;}   // 連続しているので伸ばす
      if(prev!==null)out.push({d:date,s,e});
      s=rowMin(ri);e=rowEndMin(ri);prev=ri;
    });
    if(prev!==null)out.push({d:date,s,e});
  });
  return out.sort((x,y)=>x.d===y.d?x.s-y.s:(x.d<y.d?-1:1));
}

function rowMin(ri){const r=rows(EV)[ri];return r.h*60+(r.m||0);}
function rowDur(ri){const rs=rows(EV);if(rs.length<2)return rs[0].label==="終日"?540:120;if(ri<rs.length-1)return rowMin(ri+1)-rowMin(ri);return rowMin(ri)-rowMin(ri-1);}
function rowEndMin(ri){return rowMin(ri)+rowDur(ri);}
function fmtMin(m){return pad(Math.floor(m/60))+":"+pad(m%60);}
function decs(){return normDecs(EV&&EV.decisions);}
function decDatesOf(d){const s=new Date(d.d+"T00:00:00");s.setMinutes(s.getMinutes()+d.s);const e=new Date(d.d+"T00:00:00");e.setMinutes(e.getMinutes()+d.e);return {s,e};}
function decLabelOne(d){return fmtDate(d.d)+" "+fmtMin(d.s)+"〜"+fmtMin(d.e);}
function decLabel(){return decs().map(decLabelOne).join("、");}

/* 権限まわりの失敗は、原因を推測せずサーバーの言い分をそのまま伝える。
   旧仕様で作られた調整（合鍵がサーバーに無い）は専用の案内に切り替える。 */
function decisionError(e){
  if(e&&e.message==="legacy_no_admin"){
    toast("この調整はセキュリティ更新より前に作られたため、作成者の合鍵がサーバーにありません");
    LEGACY_CLAIM=true;return;
  }
  if(e&&e.message==="forbidden"){toast("この操作の権限がありません（作成者の端末か、オーナー合言葉が必要です）");return;}
  toast("保存できませんでした。"+rpcReason(e));
}
let LEGACY_CLAIM=false;   // 合鍵が無い旧調整を検出したら、引き継ぎ導線を出す
async function saveDecisions(list,msg,action){
  const prev=EV.decisions;EV.decisions=normDecs(list);
  try{if(remoteEnabled())await remoteSetDecision(EV.id,EV.decisions.length?EV.decisions:null);else await persistLocal();}
  catch(e){EV.decisions=prev;decisionError(e);render();return false;}
toast(msg);render();return true;
}
const sameDec=(a,b)=>a.d===b.d&&a.s===b.s&&a.e===b.e;
async function addDecision(dec){
  const cur=decs();
  if(cur.some(x=>sameDec(x,dec))){toast("その枠はすでに確定しています");return;}
  await saveDecisions(cur.concat([dec]),"日程を確定しました","decided");
}
async function removeDecision(dec){

   合言葉の照合はサーバー側。ブラウザーには30分有効のランダムなセッショントークンだけを置く。 */
const OWNER_KEY="sukima:owner";        // 旧・永続保存（互換のため掃除する）
const OWNER_TS="sukima:ownerTs";
const OWNER_TOKEN="sukima:ownerToken";
try{sessionStorage.removeItem("sukima:ownerPass");}catch(e){}
const OWNER_TIMEOUT=30*60*1000;
try{localStorage.removeItem(OWNER_KEY);}catch(e){}
let OWNER={loading:false,events:null,meta:null,open:null,detail:null,err:""};
function ownerUnlocked(){
  try{const ts=+(sessionStorage.getItem(OWNER_TS)||0);
    if(!ts||!sessionStorage.getItem(OWNER_TOKEN))return false;
    if(Date.now()-ts>OWNER_TIMEOUT){sessionStorage.removeItem(OWNER_TS);sessionStorage.removeItem(OWNER_TOKEN);return false;}
    return true;}catch(e){return false;}
}
function ownerToken(){return ownerUnlocked()?(sessionStorage.getItem(OWNER_TOKEN)||""):"";}
function ownerTouch(){try{sessionStorage.setItem(OWNER_TS,String(Date.now()));}catch(e){}}
function ownerMinsLeft(){try{const ts=+(sessionStorage.getItem(OWNER_TS)||0);return ts?Math.max(0,Math.round((OWNER_TIMEOUT-(Date.now()-ts))/60000)):0;}catch(e){return 0;}}
async function sha256hex(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function ownerTryUnlock(pass){
  if(!remoteEnabled()){OWNER.err="バックエンド未設定のため利用できません";render();return false;}
  let result;
  try{result=await rpc("sukima_owner_session",{p_pass:pass||""});}catch(e){OWNER.err="接続に失敗しました";render();return false;}
  if(result==="RATE_LIMITED"){OWNER.err="合言葉を15回間違えたため、この接続元から15分間は再入力できません";render();return false;}
  if(result==="INVALID"){OWNER.err="合言葉が違います";render();return false;}
  if(typeof result==="string"&&/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(result)){
    try{sessionStorage.setItem(OWNER_TOKEN,result);}catch(e){}
    ownerTouch();OWNER.err="";render();ownerLoad();return true;
  }
  OWNER.err="認証に失敗しました。時間をおいて再度お試しください";render();return false;
}

      el("button",{class:"btn ghost sm",onclick:()=>{OWNER.open===row.id?(OWNER.open=null,OWNER.detail=null,render()):ownerOpenDetail(row.id);}},OWNER.open===row.id?"閉じる":"中身を見る"),
      el("button",{class:"btn ghost sm",onclick:()=>{SUPPRESS_HASH=true;location.hash="id="+row.id;boot();}},"この調整を開く"),
      el("button",{class:"btn ghost sm",style:"color:var(--no);border-color:var(--no)",onclick:()=>ownerDeleteEvent(row)},"削除")
    ));
    if(OWNER.open===row.id){
      const det=el("div",{style:"margin-top:12px;border-top:1px solid var(--line);padding-top:12px"});
      if(!OWNER.detail)det.append(el("div",{class:"subtle"},"読み込み中…"));
      else{
        det.append(el("div",{class:"subtle",style:"font-weight:800;margin-bottom:6px"},"回答の中身"));
        if(!OWNER.detail.answers.length)det.append(el("div",{class:"subtle"},"—"));
        OWNER.detail.answers.forEach(a=>{
          const s=ansSummary(a.cells);
          det.append(el("div",{class:"cmt"},el("b",{},esc(a.name)),"○"+s.o+" / △"+s.t+"　"+fmtStamp(a.updated_at)+(a.comment?"　💬"+esc(a.comment):"")));
        });
        det.append(el("div",{class:"subtle",style:"font-weight:800;margin:12px 0 6px"},"操作の履歴"),el("div",{class:"subtle",style:"margin-bottom:6px"},"更新後の実際のデータ変更を記録します。名前は入力された表示名で、本人確認済みの記録ではありません。更新前の履歴には、直接書き込まれた行が混ざる可能性があります。"));
        const lg=OWNER.detail.log;
        if(lg===null)det.append(el("div",{class:"subtle"},"（履歴テーブル未設定。supabase-log.sql を実行すると、誰がいつ何をしたかを記録できます）"));
        else if(!lg.length)det.append(el("div",{class:"subtle"},"—"));
        else lg.forEach(l=>det.append(el("div",{class:"cmt"},el("b",{},ACT_LABEL[l.action]||l.action),(l.who?esc(l.who)+"　":"")+fmtStamp(l.created_at)+(l.detail?"　"+esc(l.detail):""))));
      }
      card.append(det);
    }
    app.append(card);
  });
}
function decLabelOf(ev){const l=normDecs(ev.decisions);if(!l.length)return "";return l.map(decLabelOne).join("、")+(l.length>1?"（"+l.length+"件）":"");}

function viewLoading(app){app.append(el("section",{class:"card"},el("div",{class:"eyebrow"},"読み込み中"),el("p",{class:"lead",style:"margin-top:8px"},"調整を読み込んでいます…")));}
function viewNotFound(app){app.append(el("section",{class:"card"},el("div",{class:"eyebrow"},"見つかりません"),el("h1",{style:"font-size:20px;margin:6px 0"},"この調整リンクは開けませんでした"),el("p",{class:"lead"},"リンクが正しいか確認してください。作成者に再共有してもらうと直る場合があります。"),el("div",{class:"row",style:"margin-top:14px"},el("button",{class:"btn primary",onclick:()=>{SUPPRESS_HASH=true;location.hash="";go("home");}},"ホームへ"),el("button",{class:"btn ghost",onclick:()=>{go("diag");diagRun();}},"接続を診断する"))));}

/* =========================================================
   DIAG — 接続の自己診断（devtools無しで原因を特定するための画面）
   ここで扱うのは「サーバーが応答するか」だけで、調整の中身は一切表示しない。
========================================================= */
let DIAG={running:false,rows:[],verdict:""};
async function diagProbe(label,path,body,expect){
  const t0=Date.now();
  try{
    const r=await fetch(sbBase()+path,{method:body?"POST":"GET",headers:sbHeaders(),body:body?JSON.stringify(body):undefined});
    const txt=await r.text();let msg="";
    try{const j=txt?JSON.parse(txt):null;msg=(j&&j.message)||"";}catch(e){}
    return {label,status:r.status,ok:expect(r.status),msg,ms:Date.now()-t0};
  }catch(e){ return {label,status:0,ok:false,msg:"接続できません",ms:Date.now()-t0}; }
}
async function diagRun(){
  if(!remoteEnabled()){DIAG={running:false,rows:[],verdict:"このビルドにはバックエンド設定が入っていません（オフライン版）"};render();return;}
  DIAG={running:true,rows:[],verdict:""};render();
  const rows=[];
  rows.push(await diagProbe("① 調整を読む窓口 (sukima_get_event)","/rest/v1/rpc/sukima_get_event",{p_id:"zzzzzzzzzzzz"},s=>s===200));
  rows.push(await diagProbe("② 認可チェックの窓口 (sukima_owner_session)","/rest/v1/rpc/sukima_owner_session",{p_pass:"__diag__"},s=>s===200));
  /* 作成の窓口は「わざと不正な引数」で叩く。関数があれば入力チェックで400、無ければ404。
     どちらでも書き込みは発生しないので、診断で調整が増えることはない。 */
  rows.push(await diagProbe("③ 調整を作る窓口 (sukima_create_event)","/rest/v1/rpc/sukima_create_event",{p_id:"!",p_data:{},p_admin_key:"x"},s=>s===400));
  rows.push(await diagProbe("④ テーブル直アクセスの遮断","/rest/v1/events?select=id&limit=1",null,s=>s===401||s===403||s===404));
  const a=rows[0],b=rows[1],c=rows[2],d=rows[3];
  const missing=[a,b,c].some(x=>x.status===404);
  let v;
  if(missing) v="⚠ サーバー側のSQLが未適用か、APIのキャッシュが古い状態です。Supabaseで supabase-secure.sql をもう一度 Run してください（最後の1行がキャッシュを更新します）。";
  else if([a,b,c].some(x=>x.status===401||x.status===403)) v="⚠ サーバーに拒否されました。SQLの実行権限（grant）が反映されていない可能性があります。supabase-secure.sql を再実行してください。";
  else if(a.status===0) v="⚠ サーバーに接続できません。通信環境か、URLの設定を確認してください。";
  else if(!d.ok) v="⚠ テーブルに直接アクセスできてしまいます。古いSQLのままです。supabase-secure.sql を実行してください。";
  else v="✅ サーバー側は正常です。作成に失敗する場合は、アプリが古いキャッシュのままの可能性があります（下のビルド番号を確認してください）。";
  DIAG={running:false,rows,verdict:v};render();
}
function viewDiag(app){
  const card=el("section",{class:"card"});
  card.append(
    el("div",{class:"eyebrow"},"接続診断"),
    el("h1",{style:"font-size:20px;margin:6px 0 2px"},"サーバーとつながっているか調べます"),
    el("p",{class:"subtle",style:"margin:0 0 12px"},"調整の中身は表示しません。窓口が応答するかだけを確認します。")
  );
  const info=el("div",{class:"subtle",style:"margin-bottom:12px;line-height:1.7"});
  info.append(el("div",{},"ビルド: ",el("b",{},BUILD)));
  info.append(el("div",{},"接続先: ",el("b",{},remoteEnabled()?sbBase().replace(/^https?:\/\//,""):"（未設定）")));
  card.append(info);
  if(DIAG.running)card.append(el("p",{class:"lead"},"確認中…"));
  if(DIAG.verdict)card.append(el("p",{style:"font-weight:800;line-height:1.6;margin:4px 0 12px"},DIAG.verdict));
  DIAG.rows.forEach(r=>{
    card.append(el("div",{style:"display:flex;gap:8px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)"},
      el("span",{style:"font-weight:800;color:"+(r.ok?"var(--ok)":"var(--bad,#e5484d)")},r.ok?"OK":"NG"),
      el("span",{style:"flex:1"},r.label),
      el("span",{class:"subtle"},"HTTP "+(r.status||"—"))
    ));
    if(r.msg&&!r.ok)card.append(el("div",{class:"subtle",style:"padding-bottom:6px"},esc(r.msg)));
  });
  if(LAST_ERR)card.append(el("div",{class:"subtle",style:"margin-top:12px;border-top:1px solid var(--line);padding-top:10px"},
    "直近のエラー: "+LAST_ERR.fn+" / HTTP "+LAST_ERR.status+(LAST_ERR.code?" / "+LAST_ERR.code:"")+(LAST_ERR.message?" / "+LAST_ERR.message:"")));
  app.append(card);
  renderBar([el("button",{class:"btn ghost sm",onclick:()=>{SUPPRESS_HASH=true;location.hash="";go("home");}},"ホーム"),el("div",{style:"flex:1"}),el("button",{class:"btn primary",onclick:diagRun},"もう一度調べる")]);
}
function render(){const app=$("#app");app.innerHTML="";$("#bar").innerHTML="";if(SCREEN==="home")viewHome(app);else if(SCREEN==="create")viewCreate(app);else if(SCREEN==="share")viewShare(app);else if(SCREEN==="respond")viewRespond(app);else if(SCREEN==="result")viewResult(app);else if(SCREEN==="loading")viewLoading(app);else if(SCREEN==="notfound")viewNotFound(app);else if(SCREEN==="owner")viewOwner(app);else if(SCREEN==="diag")viewDiag(app);}

boot();
</script>
